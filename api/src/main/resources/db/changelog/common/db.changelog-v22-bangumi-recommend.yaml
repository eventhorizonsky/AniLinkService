databaseChangeLog:
  - changeSet:
      id: v22-bangumi-recommend-record-table
      author: anilink
      changes:
        - createTable:
            tableName: bangumi_recommend_record
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_bangumi_recommend_user
              - column:
                  name: dimensions
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: result_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: collection_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: result_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: generated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
