spring.application.name=ani-sync-service
server.port=8081

# 默认激活 H2 配置
spring.profiles.active=${DB_PROFILE:h2}

# Sa-Token 配置
# token 名称（同时也是 cookie 名称）
sa-token.token-name=ani-link-token
# token 有效期（单位：秒） 默认30天，-1 代表永久有效
sa-token.timeout=2592000
# token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
sa-token.active-timeout=-1
# 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
sa-token.is-concurrent=true
# 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
sa-token.is-share=false
# token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
sa-token.token-style=uuid
# 是否输出操作日志 
sa-token.is-log=true

# 媒体附属数据根目录（可通过容器环境变量 MEDIA_DATA_DIR 覆盖）
media.data.root-dir=${MEDIA_DATA_DIR:./data/media-data}

# 字幕抽取输出目录（可通过容器环境变量 SUBTITLE_DIR 覆盖）
media.subtitle.output-dir=${SUBTITLE_DIR:${media.data.root-dir}/subtitles}

# 缩略图输出目录（可通过容器环境变量 THUMBNAIL_DIR 覆盖）
media.thumbnail.output-dir=${THUMBNAIL_DIR:${media.data.root-dir}/thumbnails}

# Web 播放器转码/秒转（HLS）输出目录（可通过容器环境变量 TRANSCODE_DIR 覆盖）
media.transcode.output-dir=${TRANSCODE_DIR:${media.data.root-dir}/transcode}
# 转码会话空闲回收时间（分钟），播放结束或无人访问一段时间后清理进程与分片
media.transcode.idle-timeout-minutes=${TRANSCODE_IDLE_TIMEOUT_MINUTES:30}
# HLS 分片时长（秒）
media.transcode.segment-seconds=${TRANSCODE_SEGMENT_SECONDS:6}
# 首个分片就绪等待上限（秒）
media.transcode.startup-wait-seconds=${TRANSCODE_STARTUP_WAIT_SECONDS:120}
# 单分片就绪等待上限（秒），拖动到未生成区域时等待其产出
media.transcode.segment-wait-seconds=${TRANSCODE_SEGMENT_WAIT_SECONDS:60}
# 并发转码/秒转会话上限
media.transcode.max-concurrent=${TRANSCODE_MAX_CONCURRENT:1}
# ffmpeg 可用性探测超时（秒），慢速存储/模拟环境下 ffmpeg -version 冷启动可能较慢
media.transcode.probe-timeout-seconds=${TRANSCODE_PROBE_TIMEOUT_SECONDS:30}
# 转码编码线程上限（不要用 0=全部核心，单会话会吃满宿主所有 CPU，导致 JVM/HTTP 线程饥饿与内存飙升）
media.transcode.threads=${TRANSCODE_THREADS:4}
# 转码输出最大宽度（像素），越大越占 CPU/内存；web 预览一般 1280 足够，需更高画质可调大
media.transcode.max-width=${TRANSCODE_MAX_WIDTH:1920}
# 转码编码器：auto=自动探测 QSV/NVENC/VAAPI/AMF 硬件编码（回退 libx264）| qsv | nvenc | vaapi | amf | libx264
media.transcode.encoder=${TRANSCODE_ENCODER:auto}
# 距当前产出前沿多少个分片内视为"近前沿"（等待当前 ffmpeg 按序产出即可，不重锚）；
# 拖动到更远的未产出位置一律重锚从目标起转（即跳即转），避免慢编码时长时间空等卡死
media.transcode.reanchor-near-segments=${TRANSCODE_REANCHOR_NEAR_SEGMENTS:3}
# VAAPI 硬件编码设备（Docker 需挂载 /dev/dri 透传核显）
media.transcode.vaapi-device=${TRANSCODE_VAAPI_DEVICE:/dev/dri/renderD128}

# 版本信息来源的 GitHub 仓库（owner/repo，用于拉取 Release 列表）
github.repo=${GITHUB_REPO:eventhorizonsky/AniLinkService}