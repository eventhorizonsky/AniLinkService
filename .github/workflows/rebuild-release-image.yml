name: rebuild release docker image (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本号（如 1.0.0）。留空则取 HEAD 上的 git tag，其次取 pom.xml 版本'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
            if [ -n "$TAG" ]; then
              VERSION="${TAG#v}"
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' api/pom.xml | head -n1)"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::cannot resolve version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd ui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Copy frontend build to backend static resources
        run: |
          mkdir -p api/src/main/resources/static
          cp -r ui/dist/* api/src/main/resources/static/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend with Maven
        run: mvn -f api/pom.xml clean package

      - name: Prepare CHANGELOG for image
        run: |
          if [ ! -f CHANGELOG.md ]; then
            printf '# Changelog\n\nThis build does not include a changelog.\n' > CHANGELOG.md
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/anilinkserver" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}-{{sha}}
          labels: |
            org.opencontainers.image.title=AniLinkService
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=AniLinkService v${{ steps.version.outputs.version }}：本地追番、弹幕播放与 RSS 自动下载服务

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
