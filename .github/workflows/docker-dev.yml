name: docker-dev

on:
  push:
    branches: [dev]

jobs:
  docker-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd ui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Copy frontend build to backend static resources
        run: |
          mkdir -p api/src/main/resources/static
          cp -r ui/dist/* api/src/main/resources/static/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend with Maven
        run: mvn -f api/pom.xml clean package

      - name: Prepare CHANGELOG for image
        run: |
          if [ ! -f CHANGELOG.md ]; then
            printf '# Changelog\n\nThis build does not include a changelog.\n' > CHANGELOG.md
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/anilinkserver" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=dev-latest
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}-{{sha}}
          labels: |
            org.opencontainers.image.title=AniLinkService
            org.opencontainers.image.version=dev
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=AniLinkService dev build. Images are pushed for every commit to the dev branch.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
